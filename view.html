<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2E7D32">
<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="جلال عبيد">
<meta name="mobile-web-app-capable" content="yes">
 <title>مخزن مكتب جلال عبيد | جرد المواد</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
  body { margin: 0; padding: 12px; background: #eef1f5; color: #222; transition: background 0.3s, color 0.3s; }

  body.dark { background: #1a1a1a; color: #e0e0e0; }
  body.dark .table-container,
  body.dark .search-box,
  body.dark .pagination,
  body.dark .filter-tabs,
  body.dark .stats-mini { background: #2a2a2a !important; color: #e0e0e0; }
  body.dark th { background: #1B5E20; }
  body.dark td { border-color: #333; }
  body.dark tr:hover { background: #333; }
  body.dark .search-box input { background: #333; color: #e0e0e0; border-color: #444; }
  body.dark .filter-tab { background: #333; color: #e0e0e0; border-color: #444; }
  body.dark .filter-tab.active { background: #2E7D32; color: white; }
  body.dark .pagination button { background: #333; color: #e0e0e0; border-color: #444; }
  body.dark .stat-box { background: #333; }

  /* ============ الترويسة ============ */
  .header {
    background: linear-gradient(135deg, #2E7D32, #1B5E20);
    color: white; padding: 22px 18px; border-radius: 14px;
    margin-bottom: 10px; text-align: center;
    box-shadow: 0 6px 16px rgba(46,125,50,0.35);
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -50%; right: -20%;
    width: 200px; height: 200px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -60%; left: -10%;
    width: 180px; height: 180px;
    background: rgba(255,255,255,0.04);
    border-radius: 50%;
  }

  .store-badge {
    display: inline-block;
    background: rgba(255,255,255,0.18);
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 10px;
    border: 1px solid rgba(255,255,255,0.25);
    position: relative; z-index: 1;
  }

  .store-name {
    font-size: 24px;
    font-weight: bold;
    margin: 6px 0 4px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    position: relative; z-index: 1;
  }

  .store-sub {
    font-size: 13px;
    opacity: 0.92;
    margin-bottom: 8px;
    position: relative; z-index: 1;
  }

  .store-date {
    font-size: 11px;
    opacity: 0.8;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.2);
    display: inline-block;
    margin-top: 4px;
    position: relative; z-index: 1;
  }

  .theme-btn {
    position: absolute; top: 14px; left: 14px;
    background: rgba(255,255,255,0.2); border: none;
    color: white; font-size: 17px; width: 36px; height: 36px;
    border-radius: 50%; cursor: pointer; transition: all 0.15s;
    z-index: 2;
  }
  .theme-btn:hover { background: rgba(255,255,255,0.35); transform: scale(1.05); }

  /* ============ الإحصائيات ============ */
  .stats-mini {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px; margin-bottom: 10px;
    background: white; padding: 10px; border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .stat-box {
    text-align: center; padding: 10px 4px;
    background: #f8f9fa; border-radius: 8px;
    transition: transform 0.15s;
  }
  .stat-box:active { transform: scale(0.98); }
  .stat-box .num { font-size: 20px; font-weight: bold; }
  .stat-box .lbl { font-size: 10px; color: #777; margin-top: 2px; }
  .stat-box.red .num { color: #c62828; }
  .stat-box.orange .num { color: #e65100; }
  .stat-box.green .num { color: #2e7d32; }
  body.dark .stat-box .lbl { color: #aaa; }

  /* ============ تنبيه ============ */
  .alert-banner {
    background: #ffebee; border-right: 5px solid #f44336;
    padding: 12px 14px; border-radius: 12px;
    margin-bottom: 10px; box-shadow: 0 2px 8px rgba(244,67,54,0.15);
    display: none;
  }
  .alert-banner.show { display: flex; align-items: center; gap: 10px; }
  .alert-banner .icon { font-size: 24px; }
  .alert-banner .text { flex: 1; text-align: right; }
  .alert-banner .text b { font-size: 15px; color: #b71c1c; }
  .alert-banner .text p { margin: 3px 0 0; font-size: 12px; color: #555; }
  body.dark .alert-banner { background: #3a1a1a; }
  body.dark .alert-banner .text b { color: #ff8a80; }
  body.dark .alert-banner .text p { color: #ccc; }

  /* ============ البحث ============ */
  .search-box {
    background: white; padding: 10px; border-radius: 12px;
    margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    display: flex; gap: 8px; align-items: center;
  }
  .search-box input {
    flex: 1; padding: 10px 12px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 14px;
  }
  .search-box input:focus { outline: 2px solid #2E7D32; border-color: #2E7D32; }

  /* ============ الفلترة ============ */
  .filter-tabs {
    background: white; padding: 8px; border-radius: 12px;
    margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  .filter-tab {
    padding: 7px 14px; border: 1px solid #ddd; background: #f8f9fa;
    border-radius: 20px; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; gap: 5px;
  }
  .filter-tab:hover { background: #e8eaed; }
  .filter-tab.active { background: #2E7D32; color: white; border-color: #2E7D32; }
  .filter-tab .cnt {
    background: rgba(0,0,0,0.1); color: inherit;
    padding: 1px 7px; border-radius: 10px; font-size: 10px;
    font-weight: bold;
  }
  .filter-tab.active .cnt { background: rgba(255,255,255,0.25); }
  .filter-tab.low-tab.active { background: #c62828; border-color: #c62828; }
  .filter-tab.zero-tab.active { background: #e65100; border-color: #e65100; }

  /* ============ الجدول ============ */
  .table-container {
    background: white; border-radius: 12px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 10px;
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    background: #2E7D32; color: white; padding: 12px 10px;
    text-align: right; font-size: 14px; font-weight: bold;
    position: sticky; top: 0; z-index: 2;
  }
  th.idx-col { text-align: center; width: 50px; }
  th.qty-col { text-align: center; width: 100px; }
  td {
    padding: 10px; border-bottom: 1px solid #eef0f3;
    font-size: 14px;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover { background: #f8f9fb; }
  tr.low { background: #ffebee !important; }
  tr.low td { color: #b71c1c; font-weight: 600; }
  tr.zero { background: #fff8e1 !important; }
  tr.zero td { color: #7a4f00; }
  body.dark tr.low { background: #4a1e1e !important; }
  body.dark tr.low td { color: #ffb0b0; }
  body.dark tr.zero { background: #4a3a10 !important; }

  .idx-cell { text-align: center; font-size: 12px; color: #999; font-weight: normal; }
  .qty-cell { text-align: center; font-weight: bold; font-size: 15px; }
  .qty-cell.low-qty::after { content: '⚠️'; margin-right: 5px; font-size: 12px; }

  .empty { text-align: center; padding: 50px 20px; color: #999; font-size: 15px; }

  /* ============ الصفحات ============ */
  .pagination {
    background: white; padding: 10px; border-radius: 12px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    margin-bottom: 10px;
  }
  .pagination button {
    padding: 8px 14px; border: 1px solid #ddd; background: white;
    border-radius: 8px; font-size: 13px; cursor: pointer;
    font-weight: bold; transition: all 0.15s;
  }
  .pagination button:hover:not(:disabled) {
    background: #2E7D32; color: white; border-color: #2E7D32;
  }
  .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
  .pagination .page-info {
    font-size: 12px; color: #666; font-weight: bold;
    padding: 0 8px;
  }
  body.dark .pagination .page-info { color: #aaa; }

  /* ============ الأزرار العلوية ============ */
  .top-actions {
    display: flex; gap: 8px; margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 10px 16px; border: none; border-radius: 8px;
    font-size: 13px; font-weight: bold; cursor: pointer;
    transition: all 0.15s; color: white;
    display: flex; align-items: center; gap: 6px;
  }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .btn-print { background: #455A64; flex: 1; justify-content: center; }
  .btn-refresh { background: #0288D1; flex: 1; justify-content: center; }
.btn-install { background: #2E7D32; flex: 1; justify-content: center; }
 
  /* ============ التذييل ============ */
  .footer {
    text-align: center; padding: 18px 15px;
    color: #777; font-size: 12px;
    background: white; border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  body.dark .footer { background: #2a2a2a; color: #aaa; }
  .footer .store-sign {
    font-weight: bold; color: #2E7D32; font-size: 14px;
    margin-bottom: 6px;
  }
  body.dark .footer .store-sign { color: #66bb6a; }
  .footer .lock {
    display: inline-flex; align-items: center; gap: 5px;
    background: #f0f0f0; padding: 4px 12px; border-radius: 20px;
    font-size: 11px;
  }
  body.dark .footer .lock { background: #333; }

  /* ============ الجوال ============ */
  @media (max-width: 600px) {
    body { padding: 8px; }
    .store-name { font-size: 19px; }
    .store-sub { font-size: 11px; }
    .store-badge { font-size: 10px; padding: 4px 10px; }
    .header { padding: 18px 12px; }
    .theme-btn { width: 32px; height: 32px; font-size: 15px; top: 12px; left: 12px; }
    th { padding: 10px 6px; font-size: 13px; }
    td { padding: 8px 6px; font-size: 13px; }
    .qty-cell { font-size: 14px; }
    .search-box input { font-size: 13px; padding: 8px; }
    .filter-tab { padding: 6px 10px; font-size: 11px; }
    .stat-box .num { font-size: 17px; }
    .stat-box .lbl { font-size: 9px; }
    .btn { padding: 8px 12px; font-size: 12px; }
  }

  /* ============ الطباعة ============ */
  @media print {
    body { background: white !important; padding: 0; color: black !important; }
    .theme-btn,
    .search-box,
    .filter-tabs,
    .pagination,
    .top-actions,
    .alert-banner { display: none !important; }

    .header {
      background: #2E7D32 !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      border-radius: 0;
      box-shadow: none;
      margin-bottom: 15px;
    }

    .store-name { font-size: 22px; }
    .store-badge { border-color: white !important; }

    .stats-mini {
      box-shadow: none;
      border: 1px solid #ddd;
      margin-bottom: 15px;
      page-break-inside: avoid;
    }
    .stat-box { border: 1px solid #eee; }

    .table-container {
      box-shadow: none;
      border: 1px solid #ccc;
    }

    th {
      background: #2E7D32 !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      color: white !important;
    }

    tr.low { background: #ffebee !important; -webkit-print-color-adjust: exact; }
    tr.low td { color: #b71c1c !important; }
    tr.zero { background: #fff8e1 !important; -webkit-print-color-adjust: exact; }

    tr { page-break-inside: avoid; }

    .footer {
      box-shadow: none;
      border-top: 2px solid #2E7D32;
      background: white !important;
      margin-top: 15px;
    }
    .footer .lock { background: white; border: 1px solid #ddd; }
  }
</style>
</head>
<body>

<!-- ============ الترويسة ============ -->
<div class="header">
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="تبديل الوضع">🌙</button>
  <div class="store-badge">📦 تقرير جرد رسمي</div>
  <div class="store-name">🏪 مخزن مكتب جلال عبيد</div>
  <div class="store-sub">تقرير المخزون الحالي</div>
  <div class="store-date" id="reportDate">—</div>
</div>

<!-- ============ الإحصائيات ============ -->
<div class="stats-mini">
  <div class="stat-box green">
    <div class="num" id="statTotal">0</div>
    <div class="lbl">إجمالي</div>
  </div>
  <div class="stat-box red">
    <div class="num" id="statLow">0</div>
    <div class="lbl">منخفضة</div>
  </div>
  <div class="stat-box orange">
    <div class="num" id="statZero">0</div>
    <div class="lbl">صفرية</div>
  </div>
</div>

<!-- ============ التنبيه ============ -->
<div class="alert-banner" id="alertBanner">
  <div class="icon">⚠️</div>
  <div class="text">
    <b>تنبيه: <span id="lowCount">0</span> مادة منخفضة</b>
    <p>تحتاج إعادة تعبئة</p>
  </div>
</div>

<!-- ============ الأزرار ============ -->
<div class="top-actions">
  <button class="btn btn-print" onclick="window.print()">🖨️ طباعة / PDF</button>
  <button class="btn btn-refresh" onclick="manualRefresh()">🔄 تحديث</button>
<button class="btn btn-install" id="installBtn" onclick="installApp()" style="display:none;">📱 تثبيت التطبيق</button>
</div>

<!-- ============ البحث ============ -->
<div class="search-box">
  <input type="text" id="searchBox" placeholder="🔍 ابحث عن مادة..." oninput="onSearch()">
</div>

<!-- ============ الفلترة ============ -->
<div class="filter-tabs">
  <button class="filter-tab active" data-filter="all" onclick="setFilter('all', this)">
    📋 الكل <span class="cnt" id="cntAll">0</span>
  </button>
  <button class="filter-tab low-tab" data-filter="low" onclick="setFilter('low', this)">
    ⚠️ المنخفضة فقط <span class="cnt" id="cntLow">0</span>
  </button>
  <button class="filter-tab zero-tab" data-filter="zero" onclick="setFilter('zero', this)">
    0️⃣ الصفرية فقط <span class="cnt" id="cntZero">0</span>
  </button>
</div>

<!-- ============ الجدول ============ -->
<div class="table-container">
  <table id="itemsTable">
    <thead>
      <tr>
        <th class="idx-col">#</th>
        <th>اسم المادة</th>
        <th class="qty-col">الكمية</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="3" class="empty">📭 لا توجد بيانات</td></tr>
    </tbody>
  </table>
</div>

<!-- ============ الصفحات ============ -->
<div class="pagination" id="pagination" style="display:none">
  <button onclick="goFirst()" id="btnFirst">⏮</button>
  <button onclick="goPrev()" id="btnPrev">◀ السابق</button>
  <span class="page-info" id="pageInfo">صفحة 1</span>
  <button onclick="goNext()" id="btnNext">التالي ▶</button>
  <button onclick="goLast()" id="btnLast">⏭</button>
</div>

<!-- ============ التذييل ============ -->
<div class="footer">
  <div class="store-sign">🏪 مخزن مكتب جلال عبيد</div>
  <div class="lock">🔒 هذا التقرير للعرض فقط — لا يمكن التعديل عليه</div>
</div>

<script>
  let allItems = [];
  let filtered = [];
  let currentFilter = 'all';
  let currentPage = 1;
  const PAGE_SIZE = 50;
  let lastDateStr = null;

  // ============ تحميل البيانات ============
  function loadData(silent) {
    try {
      const raw = localStorage.getItem('jerid_view_data');
      if (!raw) {
        document.getElementById('tableBody').innerHTML =
          '<tr><td colspan="3" class="empty">📭 لا توجد بيانات<br><small>اطلب من المسؤول إرسال تقرير جديد</small></td></tr>';
        document.getElementById('reportDate').textContent = '—';
        document.getElementById('alertBanner').classList.remove('show');
        return;
      }

      const data = JSON.parse(raw);

      if (silent && data.date === lastDateStr) return;
      lastDateStr = data.date;

      allItems = data.items || [];

      const d = new Date(data.date);
      document.getElementById('reportDate').textContent =
        '📅 آخر تحديث: ' + d.toLocaleString('ar-EG');

      const lowCount = allItems.filter(function(i) { return i.low; }).length;
      const zeroCount = allItems.filter(function(i) { return i.qty <= 0; }).length;

      document.getElementById('statTotal').textContent = allItems.length;
      document.getElementById('statLow').textContent = lowCount;
      document.getElementById('statZero').textContent = zeroCount;
      document.getElementById('cntAll').textContent = allItems.length;
      document.getElementById('cntLow').textContent = lowCount;
      document.getElementById('cntZero').textContent = zeroCount;

      if (lowCount > 0) {
        document.getElementById('lowCount').textContent = lowCount;
        document.getElementById('alertBanner').classList.add('show');
      } else {
        document.getElementById('alertBanner').classList.remove('show');
      }

      applyFilter();
    } catch (e) {
      console.error(e);
      document.getElementById('tableBody').innerHTML =
        '<tr><td colspan="3" class="empty">❌ خطأ في قراءة البيانات</td></tr>';
    }
  }

  // ============ البحث والفلترة ============
  let searchTimer = null;
  function onSearch() {
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(function() {
      currentPage = 1;
      applyFilter();
    }, 200);
  }

  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-tab').forEach(function(b) {
      b.classList.remove('active');
    });
    if (btn) btn.classList.add('active');
    currentPage = 1;
    applyFilter();
  }

  function applyFilter() {
    const search = document.getElementById('searchBox').value.toLowerCase().trim();
    filtered = allItems.filter(function(item) {
      if (currentFilter === 'low' && !item.low) return false;
      if (currentFilter === 'zero' && item.qty > 0) return false;
      if (search && item.name.toLowerCase().indexOf(search) === -1) return false;
      return true;
    });
    renderTable();
  }

  // ============ العرض ============
  function renderTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    if (filtered.length === 0) {
      let msg = '🔍 لا توجد نتائج';
      if (currentFilter === 'low') msg = '✅ لا توجد مواد منخفضة';
      if (currentFilter === 'zero') msg = '✅ لا توجد مواد صفرية';
      tbody.innerHTML = '<tr><td colspan="3" class="empty">' + msg + '</td></tr>';
      document.getElementById('pagination').style.display = 'none';
      return;
    }

    const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * PAGE_SIZE;
    const end = Math.min(start + PAGE_SIZE, filtered.length);

    const fragment = document.createDocumentFragment();
    for (let i = start; i < end; i++) {
      const item = filtered[i];
      const tr = document.createElement('tr');
      if (item.low) tr.className = 'low';
      else if (item.qty <= 0) tr.className = 'zero';

      const td0 = document.createElement('td');
      td0.className = 'idx-cell';
      td0.textContent = allItems.indexOf(item) + 1;

      const td1 = document.createElement('td');
      td1.textContent = item.name;

      const td2 = document.createElement('td');
      td2.className = 'qty-cell' + (item.low ? ' low-qty' : '');
      td2.textContent = item.qty;

      tr.appendChild(td0);
      tr.appendChild(td1);
      tr.appendChild(td2);
      fragment.appendChild(tr);
    }
    tbody.appendChild(fragment);

    if (totalPages > 1) {
      document.getElementById('pagination').style.display = 'flex';
      document.getElementById('pageInfo').textContent =
        'صفحة ' + currentPage + ' / ' + totalPages +
        ' (' + (start + 1) + '-' + end + ' من ' + filtered.length + ')';
      document.getElementById('btnFirst').disabled = currentPage === 1;
      document.getElementById('btnPrev').disabled = currentPage === 1;
      document.getElementById('btnNext').disabled = currentPage === totalPages;
      document.getElementById('btnLast').disabled = currentPage === totalPages;
    } else {
      document.getElementById('pagination').style.display = 'none';
    }
  }

  function goFirst() { currentPage = 1; renderTable(); scrollTop(); }
  function goPrev()  { if (currentPage > 1) { currentPage--; renderTable(); scrollTop(); } }
  function goNext()  { const tp = Math.ceil(filtered.length / PAGE_SIZE); if (currentPage < tp) { currentPage++; renderTable(); scrollTop(); } }
  function goLast()  { currentPage = Math.ceil(filtered.length / PAGE_SIZE); renderTable(); scrollTop(); }
  function scrollTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

  // ============ الوضع الليلي ============
  function toggleTheme() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
    localStorage.setItem('jerid_view_theme', isDark ? 'dark' : 'light');
  }

  function loadTheme() {
    const saved = localStorage.getItem('jerid_view_theme');
    if (saved === 'dark') {
      document.body.classList.add('dark');
      document.getElementById('themeBtn').textContent = '☀️';
    }
  }

  // ============ تحديث يدوي ============
  function manualRefresh() {
    loadData(false);
  }

  // ============ تحديث تلقائي كل 5 ثوان ============
  setInterval(function() { loadData(true); }, 5000);

  // ============ بدء التشغيل ============
  window.addEventListener('DOMContentLoaded', function() {
    loadTheme();
    loadData(false);
  });

 // ============ PWA - التثبيت على الشاشة ============
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('installBtn');
  if (btn) btn.style.display = 'flex';
});

function installApp() {
  if (!deferredPrompt) {
    alert('لتثبيت التطبيق يدوياً:\n\n1. افتح قائمة المتصفح (⋮)\n2. اختر "إضافة إلى الشاشة الرئيسية" أو "تثبيت التطبيق"');
    return;
  }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(choice) {
    if (choice.outcome === 'accepted') {
      const btn = document.getElementById('installBtn');
      if (btn) btn.style.display = 'none';
    }
    deferredPrompt = null;
  });
}

window.addEventListener('appinstalled', function() {
  const btn = document.getElementById('installBtn');
  if (btn) btn.style.display = 'none';
});

// إخفاء الزر إذا كان التطبيق مثبتاً بالفعل
if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
  document.addEventListener('DOMContentLoaded', function() {
    const btn = document.getElementById('installBtn');
    if (btn) btn.style.display = 'none';
  });
}
</script>
